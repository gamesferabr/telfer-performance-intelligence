# Deploy de preview do novo layout — branch gt/layout-e-testes.
# Publica o site principal (main) na raiz e o branch desta PR em /preview/
# Assim o layout atual continua intacto em /, e o novo layout fica em /preview/.
name: Deploy GitHub Pages (preview /preview/)

on:
  push:
    branches: [gt/layout-e-testes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do main na raiz
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout da branch em /preview
        uses: actions/checkout@v4
        with:
          ref: gt/layout-e-testes
          path: site/preview

      - name: Injetar config (secrets) em main e preview
        env:
          N8N_HOST: ${{ secrets.N8N_HOST }}
          WEBHOOK_ID: ${{ secrets.WEBHOOK_ID }}
          FETCH_TIMEOUT_MS: 900000
        run: |
          if [ -z "$N8N_HOST" ] || [ -z "$WEBHOOK_ID" ]; then
            echo "::error::Defina os secrets N8N_HOST e WEBHOOK_ID no repositório."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const host = process.env.N8N_HOST;
          const webhookId = process.env.WEBHOOK_ID;
          const fetchTimeoutMs = Number(process.env.FETCH_TIMEOUT_MS || 900000);
          const cfg = { n8nHost: host, webhookId, webhookMode: 'prod', fetchTimeoutMs };
          const inline = `<script>window.TELFER_CONFIG=${JSON.stringify(cfg)};</script>`;
          const runtimeJs =
            '/** Gerado no CI — GitHub Pages */\n' +
            `window.TELFER_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`;
          const tagRuntime = '<script src="js/runtime-config.js"></script>';
          const tagConfig = '<script src="js/config.js"></script>';
          const indexFiles = ['index.html', 'analise.html'];
          const roots = ['site', 'site/preview'];
          for (const root of roots) {
            const jsDir = path.join(root, 'js');
            if (!fs.existsSync(jsDir)) continue;
            fs.writeFileSync(path.join(jsDir, 'runtime-config.js'), runtimeJs, 'utf8');
            for (const file of indexFiles) {
              const target = path.join(root, file);
              if (!fs.existsSync(target)) continue;
              let html = fs.readFileSync(target, 'utf8');
              if (html.includes(tagConfig)) html = html.replace(tagConfig, '');
              if (html.includes(tagRuntime)) {
                html = html.replace(tagRuntime, inline + '\n  ' + tagRuntime);
              } else if (!html.includes('window.TELFER_CONFIG')) {
                html = html.replace(
                  '<script src="js/index.js"></script>',
                  inline + '\n  <script src="js/index.js"></script>'
                );
              }
              fs.writeFileSync(target, html, 'utf8');
            }
          }
          NODE

      - name: Garantir .nojekyll
        run: |
          touch site/.nojekyll
          touch site/preview/.nojekyll

      - name: Verificar config injetada
        run: |
          grep -q "TELFER_CONFIG" site/index.html || (echo "site/index.html sem config" && exit 1)
          grep -q "TELFER_CONFIG" site/preview/index.html || (echo "site/preview/index.html sem config" && exit 1)
          test -f site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
