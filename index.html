<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telfer performance intelligence</title>
  <link rel="icon" type="image/png" href="LOGO_V2-PRETOEVERMELHO.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="LOGO_V2-PRETOEVERMELHO.png" />
  <meta name="theme-color" content="#c41e3a" />
  <link rel="stylesheet" href="css/telfer.css?v=5" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="header-top">
        <div class="brand-lockup">
          <img
            class="logo-horizontal"
            src="logo - horizontal - vermelho e preto.png"
            alt="Telfer Company"
            width="260"
            height="44"
          />
          <div class="brand-copy">
            <h1>Painel do Cliente</h1>
            <p>destaque odonto diadema</p>
          </div>
        </div>
        <div class="header-top-end">
          <a href="analise.html" class="link-nav link-pill">Ver Anúncios da Campanha</a>
        </div>
      </div>

      <div class="toolbar-compact">
        <div class="toolbar-row">
          <p id="periodoResumo" class="periodo-chip" aria-live="polite"></p>
          <div class="toolbar-fields">
            <label class="field field--grow">
              <span class="field-label">objetivo</span>
              <div class="field-inline">
                <select id="objetivoCampanha" class="select select--compact">
                  <option value="">Todos</option>
                </select>
                <button
                  type="button"
                  id="refreshObjetivosBtn"
                  class="btn btn-icon btn-icon--compact"
                  title="Buscar objetivos ativos na Meta"
                  aria-label="Atualizar objetivos na Meta"
                >
                  ↻
                </button>
              </div>
            </label>
          </div>
          <div class="toolbar-actions">
            <button type="button" id="generateBtn" class="btn btn-primary btn--compact">
              gerar relatório
            </button>
          </div>
        </div>
        <p id="loading" class="toolbar-feedback status-pill is-hidden" role="status">processando…</p>
        <div id="alertBanner" class="toolbar-feedback alert is-hidden" role="status"></div>
        <p id="objetivosMeta" class="toolbar-meta"></p>
      </div>
    </header>

    <section class="section-block">
      <div class="section-head">
        <div>
          <h2 class="section-title">resumo</h2>
          <p class="section-sub">métricas essenciais do período (soma das campanhas)</p>
        </div>
        <!-- <span class="scroll-hint" aria-hidden="true">arraste →</span> -->
      </div>
      <div class="kpis-scroll" tabindex="0" aria-label="Métricas resumo — role para o lado">
        <div class="kpis-track" id="kpisGrid"></div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-head">
        <div>
          <h2 class="section-title">campanhas</h2>
          <p class="section-sub">métricas essenciais por objetivo de campanha</p>
        </div>
      </div>
      <div id="campanhasContainer" class="campanhas-list"></div>
    </section>

    <section class="section-block">
      <div class="insights">
        <div class="insight-card">
          <h2 class="insight-title">insights</h2>
          <ul id="insightsList"></ul>
        </div>
        <div class="insight-card">
          <h2 class="insight-title">recomendações</h2>
          <ul id="recommendationsList"></ul>
        </div>
      </div>
    </section>

    <footer class="footer">
      <img
        class="logo-horizontal footer-logo"
        src="logo - horizontal - vermelho e preto.png"
        alt="Telfer Company"
        width="180"
        height="28"
      />
      <span>telfer performance intelligence © 2026</span>
    </footer>
  </div>

  <script src="telfer-storage.js"></script>
  <script src="js/runtime-config.js"></script>
  <script src="js/telfer-metricas.js?v=3"></script>
  <script src="js/index.js?v=3"></script>
</body>
</html>
